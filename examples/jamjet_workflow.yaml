# JamJet workflow using FlowScript Mode 3 query tools
#
# Uses JamJet's @tool integration to call FlowScript query operations
# as tool nodes in an agent workflow. The flowscript_ldp.adapter module
# provides tool-compatible functions for all 5 query operations.
#
# To register the tools in Python:
#
#   from jamjet import tool, Agent
#   from flowscript_ldp.adapter import flowscript_tensions, flowscript_blocked
#
#   tensions_tool = tool(flowscript_tensions)
#   blocked_tool = tool(flowscript_blocked)
#
#   agent = Agent(
#       "analyst",
#       model="claude-haiku-4-5-20251001",
#       tools=[tensions_tool, blocked_tool],
#       instructions="Analyze the semantic graph for tradeoffs and blockers.",
#   )
#   result = await agent.run("Analyze this graph: {ir_json}")

# Agent-first YAML definition (JamJet v0.1.x compatible)
agent:
  id: flowscript-analyst
  strategy: react
  goal: >
    Analyze the FlowScript semantic graph to identify tradeoffs,
    blockers, and provide a recommendation that addresses key tensions.
  model: claude-haiku-4-5-20251001
  tools:
    - flowscript_tensions
    - flowscript_blocked
    - flowscript_what_if
  limits:
    max_iterations: 5
    max_cost_usd: 0.10
    timeout_seconds: 60
