[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "flowscript-ldp"
version = "0.1.0"
description = "LDP Mode 3 (Semantic Graphs) reference implementation using FlowScript IR"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Phill Clapham", email = "phill@claphamdigital.com" },
]
keywords = ["llm", "delegate", "protocol", "flowscript", "semantic-graphs", "ai-agents"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
]

[tool.hatch.build.targets.wheel]
packages = ["src/flowscript_ldp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
